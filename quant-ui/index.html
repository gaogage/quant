<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <title>Quant Platform</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <!-- 防闪烁：在页面渲染前就应用 dark class -->
    <script>
      (function() {
        var mql = window.matchMedia('(prefers-color-scheme: dark)');

        function setTheme(isDark) {
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }

        // 页面加载：优先恢复持久化的模式，无记录时取系统设置
        var saved = localStorage.getItem('theme');
        if (saved === 'dark') {
          setTheme(true);
        } else if (saved === 'light') {
          setTheme(false);
        } else {
          // 首次访问，写入系统设置到 localStorage
          setTheme(mql.matches);
          localStorage.setItem('theme', mql.matches ? 'dark' : 'light');
        }

        // 系统切换 = 等同于手动切换，持久化并生效
        mql.addEventListener('change', function(e) {
          var newTheme = e.matches ? 'dark' : 'light';
          localStorage.setItem('theme', newTheme);
          setTheme(e.matches);
        });
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z"/>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors">
    <div id="main"></div>
  </body>
</html>
