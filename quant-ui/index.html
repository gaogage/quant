<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <title>Quant Platform</title>
    <!-- favicon: 量化主题(深色底 + 上升折线 + 数据点),内联 SVG 无需额外文件 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cpolyline points='5,22 12,15 18,18 27,7' fill='none' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='5' cy='22' r='2' fill='%2338bdf8'/%3E%3Ccircle cx='12' cy='15' r='2' fill='%2338bdf8'/%3E%3Ccircle cx='18' cy='18' r='2' fill='%2338bdf8'/%3E%3Ccircle cx='27' cy='7' r='2.5' fill='%2334d399'/%3E%3C/svg%3E" />
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <!-- 防闪烁：在页面渲染前就应用 dark class -->
    <script>
      (function() {
        var mql = window.matchMedia('(prefers-color-scheme: dark)');

        function setTheme(isDark) {
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }

        // 页面加载：优先恢复持久化的模式，无记录时取系统设置
        var saved = localStorage.getItem('theme');
        if (saved === 'dark') {
          setTheme(true);
        } else if (saved === 'light') {
          setTheme(false);
        } else {
          // 首次访问，写入系统设置到 localStorage
          setTheme(mql.matches);
          localStorage.setItem('theme', mql.matches ? 'dark' : 'light');
        }

        // 系统切换 = 等同于手动切换，持久化并生效
        mql.addEventListener('change', function(e) {
          var newTheme = e.matches ? 'dark' : 'light';
          localStorage.setItem('theme', newTheme);
          setTheme(e.matches);
        });
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z"/>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors">
    <div id="main"></div>
  </body>
</html>
