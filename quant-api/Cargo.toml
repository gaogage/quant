[package]
name = "quant-api"
description = "Axum HTTP API for quant system"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.clippy]
# 建模债集中区豁免（路线图 70 号 P1 决策，2026-09-19）：路由层参数透传与
# DTO 元组形态的 too_many_arguments/type_complexity 共 114 条，登记 DDD
# Step 2（参数对象化 + newtype 化）统一清偿，届时删除本豁免恢复 strict。
# 核心域 crate（common/factor/data/backtest）已 strict，不受此豁免影响。
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
quant-common.workspace = true
ndarray.workspace = true
reqwest.workspace = true
rayon = "1"
quant-data.workspace = true
quant-backtest.workspace = true
quant-factor.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
uuid.workspace = true
dotenv.workspace = true
chrono.workspace = true
sqlx.workspace = true
rust_decimal.workspace = true
imap.workspace = true
rustls-connector.workspace = true
mail-parser.workspace = true
bcrypt = "0.15"
jsonwebtoken = "9"
rand = "0.8"
cron = "0.16"
thiserror.workspace = true
